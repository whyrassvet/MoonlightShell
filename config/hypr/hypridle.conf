# Generated by rice-lock (Settings > Idle & Lockscreen). 0 minutes = never.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = @HOME@/.local/bin/rice-lock screen on
}

# lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# sleep
listener {
    timeout = 900
    on-timeout = $HOME/.local/bin/rice-sys suspend
}
